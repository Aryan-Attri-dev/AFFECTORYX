name: AFFECTORYX CI & Security Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Secrets & Credentials Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Verify No Secrets Committed
        run: |
          python3 scripts/scan_secrets.py

      - name: Verify .gitignore Enforces Security
        run: |
          git status --ignored

  backend-tests:
    name: Backend Test Suite & Isolation Verification
    runs-on: ubuntu-latest
    needs: security-audit
    env:
      ENVIRONMENT: test
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-test-secure-key-affactoryx-long-secret-key-32ch' }}
      DATABASE_URL: sqlite:///./test_affactoryx.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v
